<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Astrology</title>
    <link rel="stylesheet" href="./style.css">
</head>
<body>
    <div id="astrology">
        <h1>Astrology Insights</h1>

        <form >
            <label for="a">First Name: </label>
            <input type="text" id="a" name="userFirstName" required>
            <br><br>
            <label for="b">Surname: </label>
            <input type="text" id="b" name="userSurname" required>
            <br><br>
            <label for="c">Date of Birth(Day): </label> 
            <input type="number" id="c" name="userDOB" min="1" max="31">
            <br><br>
            <label for="d">Month: </label>
            <input type="number" id="d" name="userBirthMonth"  min="1" max="12">
            <br><br>
            <label for="e">Year: </label>
            <input type="number" id="e" name="userBirthYear min="1990" max="2026">
            <br><br>
            <button >Get Insights</button>
        </form>
        <br>
        <div id="last"></div>
     


        <!-- end of astrology -->
    </div>
    <script src="./scripit.js"></script>
</body>
</html>
